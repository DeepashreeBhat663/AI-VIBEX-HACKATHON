
{% extends "base.html" %}

{% block content %}

<h2>Report an Item</h2>

<form id="reportForm" enctype="multipart/form-data">

    <p>
        <label>Type<br>
            <select name="type" required>
                <option value="">Select Type</option>
                <option value="lost">Lost</option>
                <option value="found">Found</option>
            </select>
        </label>
    </p>

    <p>
        <label>Item name<br>
            <input type="text" name="name"
                   placeholder="Enter item name" required>
        </label>
    </p>

    <p>
        <label>Category<br>
            <select name="category" required>
                <option value="">Select Category</option>
                <option>Bottle</option>
                <option>Electronics</option>
                <option>ID Card</option>
                <option>Bag</option>
                <option>Wallet</option>
                <option>Glasses</option>
                <option>Books</option>
                <option>Other</option>
            </select>
        </label>
    </p>

    <p>
        <label>Description<br>
            <textarea name="description" rows="3"
                      placeholder="Describe the item..."
                      required></textarea>
        </label>
    </p>

    <p>
        <label>Location<br>
            <select name="location" required>
                <option value="">Select Location</option>
                <option>Library</option>
                <option>Canteen</option>
                <option>Main Block</option>
                <option>Hostel</option>
                <option>Ground</option>
                <option>Parking</option>
                <option>Auditorium</option>
                <option>Other</option>
            </select>
        </label>
    </p>

    <p>
        <label>Date<br>
            <input type="date" name="date" required>
        </label>
    </p>

    <p>
        <label>Your phone or email<br>
            <input type="text" name="contact"
                   placeholder="Enter contact details" required>
        </label>
    </p>

    <p>
        <label>Photo<br>
            <input type="file" name="photo" accept="image/*">
        </label>
    </p>

    <button type="submit" id="submitBtn">Submit</button>

</form>

<p id="message"></p>

<script>

const reportForm = document.getElementById("reportForm");

reportForm.addEventListener("submit", async function(e) {

    e.preventDefault();

    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";
    message.textContent = "";

    try {

        const response = await fetch("/report", {
            method: "POST",
            body: new FormData(reportForm)
        });

        const responseText = await response.text();

        console.log("HTTP Status:", response.status);
        console.log("Server Response:", responseText);

        let data;

        try {
            data = JSON.parse(responseText);
        } catch (error) {
            throw new Error(
                "Server returned an invalid response. Check the Flask terminal and browser Console."
            );
        }

        if (response.ok) {

            message.textContent = data.message || "Item reported successfully!";
            message.style.color = "green";

            reportForm.reset();

            setTimeout(function() {
                window.location.href = "/";
            }, 1500);

        } else {

            message.textContent = data.error || "Failed to submit item.";
            message.style.color = "red";

        }

    } catch (error) {

        console.error("Submission error:", error);

        message.textContent = error.message;
        message.style.color = "red";

    } finally {

        submitBtn.disabled = false;
        submitBtn.textContent = "Submit";

    }

});

</script>

{% endblock %}
