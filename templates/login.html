{% extends "base.html" %}
{% block content %}
<div class="auth">
  <h2>Welcome back 👋</h2>
  <form method="post">
    <label>Email
      <input name="email" type="email" placeholder="you@college.edu" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" placeholder="Your password" required>
    </label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p>New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
