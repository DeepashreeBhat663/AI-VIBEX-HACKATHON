{% extends "base.html" %}

{% block content %}

<div class="auth">
    <h2>Login</h2>

    <form method="POST">

        <label>Email</label>
        <input type="email"
               name="email"
               placeholder="you@college.edu"
               required>

        <br><br>

        <label>Password</label>
        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        New User?
        <a href="{{ url_for('register') }}">
            Register Here
        </a>
    </p>

</div>

{% endblock %}
