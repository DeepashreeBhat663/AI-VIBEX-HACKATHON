{% extends "base.html" %}
{% block content %}
<h2>Report an Item</h2>
<form id="reportForm" enctype="multipart/form-data">
  <p><label>Type<br>
    <select name="type" required>
      <option value="lost">Lost</option>
      <option value="found">Found</option>
    </select></label></p>
  <p><label>Item name<br><input name="name" required></label></p>
  <p><label>Category<br>
    <select name="category" required>
      <option>Bottle</option><option>Electronics</option><option>ID Card</option>
      <option>Bag</option><option>Wallet</option><option>Glasses</option>
      <option>Books</option><option>Other</option>
    </select></label></p>
  <p><label>Description<br><textarea name="description" rows="3" required></textarea></label></p>
  <p><label>Location<br>
    <select name="location" required>
      <option>Library</option><option>Canteen</option><option>Main Block</option>
      <option>Hostel</option><option>Ground</option><option>Parking</option>
      <option>Auditorium</option><option>Other</option>
    </select></label></p>
  <p><label>Date<br><input type="date" name="date" required></label></p>
  <p><label>Your phone or email<br><input name="contact" required></label></p>
  <p><label>Photo<br><input type="file" name="photo" accept="image/*"></label></p>
  <button type="submit">Submit</button>
</form>

<script>
document.getElementById("reportForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  const res = await fetch("/report", { method: "POST", body: new FormData(this) });
  const data = await res.json();
  if (res.ok) { window.location.href = "/"; }
  else { alert(data.error || "Something went wrong"); }
});
</script>
{% endblock %}
